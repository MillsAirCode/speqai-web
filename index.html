<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeqAI Voice Chat</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 10px;
      color: #00d4ff;
    }
    .subtitle {
      color: #888;
      margin-bottom: 30px;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .card h3 {
      margin-top: 0;
      color: #00d4ff;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 16px;
      margin-bottom: 16px;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    button {
      padding: 16px 32px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }
    #connectBtn {
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: #000;
      width: 100%;
    }
    #connectBtn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(0,212,255,0.4);
    }
    #connectBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    #talkBtn {
      background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
      color: #fff;
      width: 100%;
      display: none;
    }
    #talkBtn:hover {
      transform: scale(1.02);
    }
    #talkBtn.active {
      background: linear-gradient(135deg, #51cf66, #40c057);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(81, 207, 102, 0.4); }
      50% { box-shadow: 0 0 0 15px rgba(81, 207, 102, 0); }
    }
    #status {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    #status.disconnected { background: rgba(255,107,107,0.2); color: #ff6b6b; }
    #status.connecting { background: rgba(255,193,7,0.2); color: #ffc107; }
    #status.connected { background: rgba(81,207,102,0.2); color: #51cf66; }
    #log {
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      padding: 16px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 12px;
      color: #888;
    }
    #log .info { color: #00d4ff; }
    #log .error { color: #ff6b6b; }
    #log .success { color: #51cf66; }
    .visualizer {
      height: 60px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 0 20px;
    }
    .bar {
      width: 4px;
      background: linear-gradient(to top, #00d4ff, #0099cc);
      border-radius: 2px;
      transition: height 0.05s;
    }
  </style>
</head>
<body>
  <h1>🎙️ SpeqAI Voice Chat</h1>
  <p class="subtitle">Server-side Opus conversion</p>
  
  <div class="container">
    <div id="status" class="disconnected">Disconnected</div>
    
    <div class="visualizer" id="visualizer">
      <!-- Bars added by JS -->
    </div>
    
    <div class="card">
      <h3>⚙️ Settings</h3>
      
      <label for="prompt">System Prompt</label>
      <textarea id="prompt">You are a helpful, friendly voice assistant. Keep responses concise and conversational.</textarea>
      
      <label for="voice">Voice</label>
      <select id="voice">
        <option value="alloy">Alloy</option>
        <option value="echo">Echo</option>
        <option value="fable">Fable</option>
        <option value="onyx">Onyx</option>
        <option value="nova">Nova</option>
        <option value="shimmer">Shimmer</option>
      </select>
      
      <label for="model">Model</label>
      <select id="model">
        <option value="speqai-base">SpeqAI Base</option>
        <option value="gpt-4o-mini">GPT-4o Mini</option>
        <option value="gpt-4o">GPT-4o</option>
      </select>
    </div>
    
    <button id="connectBtn">🔌 Connect</button>
    <button id="talkBtn">🎤 Hold to Talk</button>
    
    <div class="card">
      <h3>📋 Log</h3>
      <div id="log"></div>
    </div>
  </div>
  
  <script src="client.js"></script>
</body>
</html>
